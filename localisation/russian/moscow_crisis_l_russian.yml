l_russian:
 MOS:0 "Администрация Москвы"
 MOS_DEF:0 "Администрация Москвы"
 MOS_ADJ:0 "Московский"
 moscow_crisis.1.t:0 "Порядок охраны районов"
 moscow_crisis.1.desc:0 "Администрация Москвы передала окраинные районы конкурирующим организациям. Вихрь требует от Огорода принять новую схему безопасности. Совет может рискнуть войной или попытаться выиграть время через муниципальные процедуры."
 moscow_crisis.1.a:0 "Мобилизоваться и объявить войну Вихрю."
 moscow_crisis.1.b:0 "Согласиться на первую муниципальную проверку."
 moscow_crisis.2.t:0 "Контрольный пункт Левобережного"
 moscow_crisis.2.desc:0 "Вихрь требует передать Левобережный. Совет Огорода понимает: первая уступка станет прецедентом."
 moscow_crisis.2.a:0 "Хватит. Объявить войну Вихрю."
 moscow_crisis.2.b:0 "Передать Левобережный."
 moscow_crisis.2.c:0 "Попросить администрацию об отсрочке."
 moscow_crisis.3.t:0 "Меморандум о Ховрине"
 moscow_crisis.3.desc:0 "Следующим становится Ховрино. Местные командиры спрашивают, собирается ли совет защищать хоть один район."
 moscow_crisis.3.a:0 "Остановить процесс. Объявить войну."
 moscow_crisis.3.b:0 "Подписать передачу Ховрина."
 moscow_crisis.3.c:0 "Использовать окно муниципального посредничества."
 moscow_crisis.4.t:0 "Ультиматум Западному Дегунину"
 moscow_crisis.4.desc:0 "Вихрь приблизился к западной границе северного пояса Огорода. Третья передача заметно ослабит совет."
 moscow_crisis.4.a:0 "Следующим шагом будет война."
 moscow_crisis.4.b:0 "Отдать Западное Дегунино."
 moscow_crisis.4.c:0 "В последний раз обратиться к городскому совету."
 moscow_crisis.5.t:0 "Переворот Тёмного Дозора"
 moscow_crisis.5.desc:0 "После трёх уступок руководство Огорода теряет власть над командирами. Сторонники Ильича захватывают Отрадное, Восточное Дегунино и Головинский. У Тёмного Дозора нет цельной доктрины — только секретность, запугивание и культ силы."
 moscow_crisis.5.a:0 "Старый совет больше не управляет улицами."
 MOS_first_mandate:0 "Муниципальный мандат"
 MOS_first_mandate_desc:0 "Задача администрации Москвы — удержать центр, пока конкурирующие организации превращают окраины в предмет торга."
 MOS_admin_records:0 "Восстановить районные реестры"
 MOS_admin_records_desc:0 "Списки владельцев, пропуска и графики патрулей необходимо свести в единую систему."
 MOS_public_works:0 "Сохранить движение в городе"
 MOS_public_works_desc:0 "Дороги, склады и транспортные соединения доказывают, что администрация ещё существует."
 MOS_municipal_guard:0 "Организовать муниципальную охрану"
 MOS_municipal_guard_desc:0 "Небольшая подотчётная охрана защищает административные здания и инфраструктуру."
 MOS_investigate_private_contracts:0 "Проверить частные контракты"
 MOS_investigate_private_contracts_desc:0 "Администрация проверяет закупки и охранные контракты. У Вихря меньше пространства для манёвра, а Огород получает шанс стабилизироваться."
 MOS_mediation_committee:0 "Созвать комитет посредничества"
 MOS_mediation_committee_desc:0 "Город не выбирает один клан, но может потребовать объяснений и дать Огороду одну отсрочку."
 MOS_emergency_mandate:0 "Чрезвычайный муниципальный мандат"
 MOS_emergency_mandate_desc:0 "Совет получает временные полномочия координировать безопасность, транспорт и экстренные службы."
 MOS_defend_city_charter:0 "Защитить городской устав"
 MOS_defend_city_charter_desc:0 "Нейтралитет не означает бездействие. Власть администрации нужно защищать институтами и логистикой."
 VOR_contract_pressure:0 "Давление через контракты"
 VOR_contract_pressure_desc:0 "Спартак делает каждую передачу упорядоченной, договорной и неизбежной."
 VOR_claim_registry:0 "Зарегистрировать новый периметр"
 VOR_claim_registry_desc:0 "Каждая уступка становится строкой в реестре."
 DWA_first_coup:0 "Закрепить переворот"
 DWA_first_coup_desc:0 "Сторонники Ильича наследуют небольшую территорию и сеть личных долгов."
 DWA_watch_discipline:0 "Дозор без сна"
 DWA_watch_discipline_desc:0 "Организация учится удерживать давление небольшими лояльными отрядами."
 DWA_personal_loyalty:0 "Внутренний круг"
 DWA_personal_loyalty_desc:0 "Власть Ильича строится на личных обязательствах и взаимной уязвимости."
 DWA_reach_into_ogorod:0 "Вернуться в Огород"
 DWA_reach_into_ogorod_desc:0 "Оставшиеся районы Огорода считаются незаконченным делом."
 DWA_open_conflict:0 "Сделать конфликт открытым"
 DWA_open_conflict_desc:0 "Тёмный Дозор отказывается от притворства, будто он только охранная организация."
 DWA_spectacle:0 "Страх как спектакль"
 DWA_spectacle_desc:0 "Провокационная символика служит инструментом устрашения."
 DWA_unseen_administration:0 "Администрация в тени"
 DWA_unseen_administration_desc:0 "Приказы проходят через посредников и исчезают из реестров."
 DWA_shadow_rule:0 "Город под городом"
 DWA_shadow_rule_desc:0 "Тёмный Дозор предлагает постоянное подозрение, поддерживаемое секретностью и личной силой."
 MOS_municipal_authority_spirit:0 "Муниципальная власть"
 MOS_municipal_authority_spirit_desc:0 "Администрация сохраняет хрупкую монополию на службы, реестры и центральные районы."
 MOS_civic_guard_spirit:0 "Муниципальная охрана"
 MOS_civic_guard_spirit_desc:0 "Охрана подотчётна; её задача — защищать инфраструктуру."
 MOS_transport_spirit:0 "Работающая транспортная сеть"
 MOS_transport_spirit_desc:0 "Налаженная сеть ускоряет перемещение подразделений и снабжения."
 MOS_emergency_mandate_spirit:0 "Чрезвычайный муниципальный мандат"
 MOS_emergency_mandate_spirit_desc:0 "Временные полномочия координируют безопасность и транспорт, усиливая милитаризацию."
 VOR_absorption_program_spirit:0 "План административного поглощения"
 VOR_absorption_program_spirit_desc:0 "Вихрь превращает уступки в прецеденты, а прецеденты — в территориальные требования."
 DWA_dark_watch_spirit:0 "Тёмный Дозор"
 DWA_dark_watch_spirit_desc:0 "Секретность и запугивание дают преимущество, одновременно подрывая стабильность."
 DWA_shadow_network_spirit:0 "Теневая сеть"
 DWA_shadow_network_spirit_desc:0 "Дозор опирается на закрытые каналы, осведомителей и взаимные долги."
 DWA_spectacle_spirit:0 "Радикальный спектакль"
 DWA_spectacle_spirit_desc:0 "Провокационная эстетика мобилизует сторонников, но усиливает нестабильность."
 MOS_council_desc:0 "Гражданский администратор, пытающийся сохранить службы и публичную власть в борьбе конкурирующих организаций."
