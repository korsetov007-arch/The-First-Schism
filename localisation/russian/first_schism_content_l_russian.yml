l_russian:
 FIRST_SCHISM.1.b:0 "Сохранить компромисс любой ценой."
 VOR_first_schism:0 "Бумажный мир Вихря"
 VOR_first_schism_desc:0 "Старые уставы хранят печати людей, которые давно не доверяют друг другу. Спартак предлагает сохранить формальный порядок, пока штаб готовится к его неизбежному концу."
 VOR_vortex_group:0 "Группа «Вихрь»"
 VOR_vortex_group_desc:0 "Из сводок, пропусков и личных долгов Спартак собирает новый центр власти. Группа не обещает справедливости. Она обещает исполнение приказов."
 VOR_military_reform:0 "Штаб без иллюзий"
 VOR_military_reform_desc:0 "Командиров проверят не речами, а списками потерь и скоростью выполнения распоряжений. Армия Вихря должна стать инструментом, лишённым собственного мнения."
 VOR_shadow_office:0 "Кабинет без вывески"
 VOR_shadow_office_desc:0 "Небольшой отдел получит право изымать переписку, назначать наблюдателей и закрывать вопросы без протокола. Его полномочия нигде не записаны, потому что в этом нет необходимости."
 VOR_disposable_detachments:0 "Расходные отряды"
 VOR_disposable_detachments_desc:0 "В отдельную графу штатного расписания войдут люди, чьи имена не понадобятся после операции. Командование называет это гибкостью. В поле используют другое слово."
 VOR_war_revival:0 "Возвращение WAR"
 VOR_war_revival_desc:0 "Спартак считает, что время осторожных аббревиатур прошло. Старое название WAR вернётся на документы и знамёна как признание того, чем Вихрь был всегда."
 VOR_total_mobilization:0 "Последняя мобилизация"
 VOR_total_mobilization_desc:0 "Тыл, резерв и гражданская администрация подчиняются единому графику. Никто не спрашивает, что останется после победы, потому что вопрос уже сочли дезорганизацией."
 VOR_old_account:0 "Старый счёт"
 VOR_old_account_desc:0 "Огород назван причиной каждой неудачи и адресатом каждого будущего репарационного списка. Войне остаётся получить юридическую форму."
 VOR_war_collapse:0 "Крах WAR"
 VOR_war_collapse_desc:0 "Слишком много приказов исходит из пустых кабинетов, слишком много отрядов существует только в отчётах. Система WAR должна рухнуть, прежде чем её руины снова кому-то понадобятся."
 VOR_shadow_vortex_rebirth:0 "Вихрь из подполья"
 VOR_shadow_vortex_rebirth_desc:0 "Спартак переживёт собственное поражение в служебных записках и ночных переговорах. Новый Вихрь не станет государством. Он станет привычкой государства спрашивать разрешения."
 VOR_ambrelnoe_selo:0 "Амбрельное село"
 VOR_ambrelnoe_selo_desc:0 "Шланг предлагает начать не с армии, а с одного села, где власть ещё можно измерить мешками зерна и числом вооружённых соседей. Амбрельное станет его первым штабом."
 VOR_local_war:0 "Маленькая война"
 VOR_local_war_desc:0 "Здесь нет фронтов, только дороги, колодцы и дома, которые нельзя оставлять противнику. Победа определяется тем, кто останется в селе после темноты."
 VOR_guerrilla_warfare:0 "Война на выход"
 VOR_guerrilla_warfare_desc:0 "Отряды Шланга не удерживают позиции. Они исчезают раньше карателей и возвращаются раньше обозов, превращая местность в продолжение собственного штаба."
 VOR_popular_support:0 "Хлеб вместо приказов"
 VOR_popular_support_desc:0 "Реквизиционные книги заменят списками нуждающихся, а патрули получат приказ охранять распределение. Поддержка населения окажется ресурсом не менее дефицитным, чем патроны."
 VOR_exiles_dossier:0 "Дело изгнанника"
 VOR_exiles_dossier_desc:0 "После передачи власти Атаманову имя Пидофила исчезло из официальных бумаг Огорода. В архиве Вихря оно появилось вновь — на отдельной папке без грифа."
 VOR_revanchist_network:0 "Сеть реванша"
 VOR_revanchist_network_desc:0 "Бывшие clerks, обиженные офицеры и торговцы чужими секретами получают один адрес для связи. Пидофил называет это восстановлением справедливости и заранее составляет список виновных."
 VOR_betrayal_at_council:0 "Предательство в совете"
 VOR_betrayal_at_council_desc:0 "Нужный голос будет куплен, нужный свидетель молчать, а протокол заседания окажется подписан до его начала. Возвращение начинается с признания, что прежние правила были лишь инструментом."
 VOR_new_ogorod:0 "Новый Огород"
 VOR_new_ogorod_desc:0 "Пидофил готов переступить порог, который когда-то покинул без охраны и без прощания. Остаётся решить, вернётся ли он как властитель нового порядка или как его невидимый совладелец."
 OGO_first_schism:0 "Протокол раскола"
 OGO_first_schism_desc:0 "Совет ещё заседает, но его решения уже расходятся по двум канцеляриям. Следующий протокол определит не порядок дня, а само право Огорода на существование."
 OGO_emergency_council:0 "Чрезвычайный совет"
 OGO_emergency_council_desc:0 "Компромисс объявлен формой саботажа. Постоянный совет заменяется чрезвычайным, заседания сокращаются, а ответственность за войну распределяется между всеми, кроме принявших решение."
 OGO_general_mobilization:0 "Все на защиту Огорода"
 OGO_general_mobilization_desc:0 "Повестки печатаются до утверждения списков, склады переходят под военный учёт, а отказ получает единую формулировку. Огород впервые говорит одним голосом — голосом призывной комиссии."
 OGO_iron_hand:0 "Железная рука"
 OGO_iron_hand_desc:0 "Пидофил требует дисциплины без поправок на знакомство и заслуги. Любая колеблющаяся инстанция будет заменена человеком, который понимает только исполнено или не исполнено."
 OGO_defeat_vortex:0 "Покончить с Вихрем"
 OGO_defeat_vortex_desc:0 "Война должна закончиться не очередной договорённостью, а исчезновением самостоятельного Вихря. Только тогда чрезвычайный порядок можно будет назвать временным."
 OGO_negotiations:0 "Переговоры в пустом зале"
 OGO_negotiations_desc:0 "Стороны садятся за стол после ухода самых непримиримых. В повестке нет примирения, только процедура раздела власти, но даже она лучше общего военного протокола."
 OGO_division_of_power:0 "Раздел полномочий"
 OGO_division_of_power_desc:0 "Каждая должность получает дублёра, каждый приказ — вторую подпись. Совет становится устойчивее ровно настолько, насколько его члены уверены во взаимном шантаже."
 OGO_atamanov_transfer:0 "Передача Атаманову"
 OGO_atamanov_transfer_desc:0 "Атаманов соглашается принять администрацию, архив и обязательство не спрашивать о судьбе прежнего главы. Новый Вагнер начнётся с тщательно оформленного отречения."
 OGO_ilyich_conspiracy:0 "Заговор Ильича"
 OGO_ilyich_conspiracy_desc:0 "Ильич собирает не сторонников, а совпадения интересов. Достаточно, чтобы охрана опоздала, курьер ошибся дверью, а Атаманов остался один в нужный час."
 OGO_ilyich_coup:0 "Ночь длинных списков"
 OGO_ilyich_coup_desc:0 "Гидра не выйдет на площадь. Она явится в кабинеты с уже напечатанными назначениями, оставив старой власти только место в списке на замену."
 OGO_party_purges:0 "Чистка аппарата"
 OGO_party_purges_desc:0 "Каждый отдел обязан назвать ненадёжных сотрудников и подтвердить лояльность оставшихся. Число врагов растёт пропорционально числу подписанных анкет."
 OGO_chaos_indivisible:0 "Хаос неделим"
 OGO_chaos_indivisible_desc:0 "Из чисток рождается не порядок, а движение, для которого любая устойчивая власть подозрительна. Хаос Неделимый провозглашает постоянную борьбу единственной формой единства."
 OGO_dimbaz_coup:0 "Красный переворот"
 OGO_dimbaz_coup_desc:0 "Димбаз использует усталость аппарата и готовность солдат слушать любого, кто предложит конец бесконечным анкетам. На этот раз списки составлены по классовому признаку."
 OGO_red_hammer:0 "Красный Молот"
 OGO_red_hammer_desc:0 "Новое правительство называет собственный переворот революцией, а старую Гидру — подготовкой к ней. Красный Молот начинает историю с чистой страницы, на которой уже стоят его подписи."
 OGO_bair_memoranda:0 "Записки Баира"
 OGO_bair_memoranda_desc:0 "Баир переводит лозунги в таблицы снабжения и сроки армейских операций. Его записки скупы, точны и потому опаснее любой речи Димбаза."
 OGO_war_with_vortex:0 "Война с Вихрем"
 OGO_war_with_vortex_desc:0 "Красный Молот объявляет Вихрь последним оплотом старого мира. За формулировками скрывается простая задача: сделать соседнюю войну оправданием собственного существования."
 OGO_departure:0 "Отъезд Димбаза и Баира"
 OGO_departure_desc:0 "Димбаз и Баир покидают столицу вместе с частью архива и людьми, чья преданность принадлежит лично им. Ильичу остаются пустые кабинеты, незаконченная война и право объяснить итог."
 OGO_late_era:0 "После всех эпох"
 OGO_late_era_desc:0 "Старые названия исчерпаны вместе с людьми, которые им придавали смысл. Перчик предлагает два проекта: Арену Ильича, где власть проверяется борьбой, или Долганскую лигу Атаманова, где она распределяется договором."
 first_schism.2.t:0 "Вагнер без Пидофила"
 first_schism.2.desc:0 "Акт передачи власти занимает три страницы. На первой Пидофил отказывается от должности, на второй Атаманов принимает командование, на третьей обе стороны обязуются считать прошлое закрытым. Утром изгнанник покидает Огород, а печать Вагнера ложится на новый протокол."
 first_schism.2.a:0 "Подписать акт передачи."
 first_schism.3.t:0 "Гидра поднимает головы"
 first_schism.3.desc:0 "К рассвету ключевые кабинеты заняты людьми Ильича. Атаманов отстранён без публичного обвинения, охрана получает новые инструкции, а название Гидра появляется на документах раньше, чем кто-либо решается произнести его вслух."
 first_schism.3.a:0 "Новый порядок уже здесь."
 first_schism.4.t:0 "Красный Молот"
 first_schism.4.desc:0 "Димбаз выступает перед солдатами и служащими с коротким обещанием: закончить эпоху тайных кабинетов. К ночи красные полотнища закрывают старые вывески, а Гидра объявлена очередным этапом революционной подготовки."
 first_schism.4.a:0 "Молот падёт на старый порядок."
 first_schism.5.t:0 "Поезд на восток"
 first_schism.5.desc:0 "Димбаз и Баир уезжают без торжественного проводного митинга. Вместе с ними исчезают верные им комиссары и часть военного архива. Ильич возвращается к управлению как человек, который никогда не покидал здание и потому якобы не отвечает за происшедшее."
 first_schism.5.a:0 "Оформить ещё одну временную передачу."
 first_schism.6.t:0 "Два наследства"
 first_schism.6.desc:0 "Перчик согласует оба варианта будущего и не скрывает, что в любом из них канцелярия сохранит реальную власть. Ильич предлагает Арену — порядок открытого состязания силы. Атаманов предлагает Долганскую лигу — порядок обязательств, компромиссов и тщательно разграниченных вотчин."
 first_schism.6.a:0 "Арена: Ильич и Перчик."
 first_schism.6.b:0 "Долганская лига: Атаманов и Перчик."
 first_schism.7.t:0 "Списки лояльности"
 first_schism.7.desc:0 "Проверка начинается с бывших людей Атаманова, затем переходит к тем, кто проводил проверку. Отделы соревнуются в числе разоблачений, а каждое оправдание становится материалом следующего дела."
 first_schism.7.a:0 "Продолжить до полной ясности."
 first_schism.8.t:0 "Война под красным знаменем"
 first_schism.8.desc:0 "Военный совет получает директиву об уничтожении Вихря. Димбаз называет наступление освобождением, Баир уточняет нормы снабжения, и никто не фиксирует момент, когда революционная риторика окончательно становится инструкцией генерального штаба."
 first_schism.8.a:0 "Начать последний революционный поход."
 first_schism.10.t:0 "WAR возвращается"
 first_schism.10.desc:0 "Спартак подписывает приказ о восстановлении WAR без церемонии и без публичного обращения. Старое название должно говорить само за себя. Через несколько часов в Огород уходят сообщения о новом военном порядке по соседству."
 first_schism.10.a:0 "Пусть название больше никого не обманывает."
 first_schism.11.t:0 "Тёмный Дозор"
 first_schism.11.desc:0 "Возвращение WAR заставляет Ильича предложить ответную трансформацию. Тёмный Дозор станет администрацией постоянного наблюдения, где каждый житель одновременно считается охранником порядка и его потенциальным нарушителем."
 first_schism.11.a:0 "Заступить на тёмный дозор."
 first_schism.11.b:0 "Не менять государство по чужому приказу."
 first_schism.12.t:0 "Крах WAR"
 first_schism.12.desc:0 "Мобилизационные планы требуют людей, которых больше нет, а приказы — веры, которой больше нет. Отряды покидают позиции, службы прекращают отчитываться, и WAR распадается с аккуратностью, свойственной только его бумагам."
 first_schism.12.a:0 "Собрать то, что ещё подчиняется."
 first_schism.13.t:0 "Вихрь без флага"
 first_schism.13.desc:0 "Из переговоров в подвалах и сохранённых списков связи возникает новый Вихрь. Спартак отказывается от громкого названия WAR. Теперь власть должна быть незаметной, а потому почти неуязвимой."
 first_schism.13.a:0 "Работать из тени."
 first_schism.14.t:0 "Человек, который вернулся"
 first_schism.14.desc:0 "Пидофил прибывает без свиты и приносит только папку старых долгов. За годы изгнания он не простил Огород, не забыл Вихрь и не научился отличать государство от собственной биографии. Совет должен решить, какое место занять человеку, уже назначившему себя наследником."
 first_schism.14.a:0 "Провозгласить Новый Огород Пидофила."
 first_schism.14.b:0 "Оставить его за закрытой дверью власти."
 VOR_vortex_group_spirit:0 "Группа «Вихрь»"
 VOR_vortex_group_spirit_desc:0 "Личная вертикаль Спартака сокращает расстояние между приказом и исполнением, одновременно делая любое возражение служебным проступком."
 VOR_reformed_command_spirit:0 "Переформированный штаб"
 VOR_reformed_command_spirit_desc:0 "Командиры обучены действовать по единым инструкциям, а резервы проходят ускоренную подготовку под контролем штабных проверяющих."
 VOR_shadow_office_spirit:0 "Теневой кабинет"
 VOR_shadow_office_spirit_desc:0 "Неучтённый отдел контролирует переписку и каналы связи. Его сотрудники редко появляются в списках, но их визы встречаются повсюду."
 VOR_disposable_detachments_spirit:0 "Расходные отряды"
 VOR_disposable_detachments_spirit_desc:0 "Командование готово платить людьми за темп операции. Боевой дух растёт, общественное доверие — нет."
 VOR_war_spirit:0 "Военное государство WAR"
 VOR_war_spirit_desc:0 "Старое название сняло последние ограничения с армейского командования и превратило войну в обычную форму управления."
 VOR_total_mobilization_spirit:0 "Тотальная мобилизация"
 VOR_total_mobilization_spirit_desc:0 "Резервы, транспорт и администрация работают по военному графику. Отмена мобилизации не предусмотрена действующими инструкциями."
 VOR_war_collapse_spirit:0 "Руины WAR"
 VOR_war_collapse_spirit_desc:0 "Связь между штабом и страной утрачена. Каждый приказ приходится подтверждать заново, а каждый отчёт проверять на предмет выдуманных подразделений."
 VOR_shadow_vortex_spirit:0 "Теневой Вихрь"
 VOR_shadow_vortex_spirit_desc:0 "Возрождённая сеть Спартака влияет на решения через архивы, посредников и зависимости вместо открытых приказов."
 VOR_ambrelnoe_spirit:0 "Амбрельный порядок"
 VOR_ambrelnoe_spirit_desc:0 "Местная администрация опирается на понятные правила распределения и личную ответственность руководителей перед жителями."
 VOR_guerrilla_spirit:0 "Партизанская география"
 VOR_guerrilla_spirit_desc:0 "Тропы, укрытия и местные наблюдатели образуют вторую карту страны, недоступную регулярному противнику."
 VOR_popular_support_spirit:0 "Народная поддержка"
 VOR_popular_support_spirit_desc:0 "Охрана распределения и ограничение реквизиций создают доверие, которое командование старается не тратить впустую."
 VOR_exile_network_spirit:0 "Сеть изгнанника"
 VOR_exile_network_spirit_desc:0 "Сторонники Пидофила поддерживают связь через бывших служащих и торговые посредничества, подрывая устойчивость официального курса."
 VOR_revanchism_spirit:0 "Реваншистская канцелярия"
 VOR_revanchism_spirit_desc:0 "Счета к старому Огороду превращены в политическую программу. Каждый новый союзник получает обещание будущего возмещения."
 VOR_new_ogorod_spirit:0 "Новый Огород"
 VOR_new_ogorod_spirit_desc:0 "Пидофил соединяет возвращённую власть с аппаратом Вихря и требует считать этот порядок не оккупацией, а исправленной преемственностью."
 VOR_compact_spirit:0 "Соглашение за закрытой дверью"
 VOR_compact_spirit_desc:0 "Пидофил получил доступ к решениям, но не публичный трон. Правящая группа использует его связи, опасаясь цены следующей услуги."
 OGO_emergency_rule_spirit:0 "Чрезвычайное управление"
 OGO_emergency_rule_spirit_desc:0 "Военные сроки заменили обычную процедуру. Совет заседает коротко, а его решения обжалованию не подлежат."
 OGO_iron_hand_spirit:0 "Железная рука"
 OGO_iron_hand_spirit_desc:0 "Единая ответственность и суровые проверки дисциплинируют аппарат, оставляя мало места для несогласия."
 OGO_ogorod_victory_spirit:0 "Ликвидация Вихря"
 OGO_ogorod_victory_spirit_desc:0 "Армия и администрация ориентированы на окончательное решение вопроса Вихря, каким бы ни оказалось это решение на практике."
 OGO_divided_council_spirit:0 "Разделённый совет"
 OGO_divided_council_spirit_desc:0 "Двойные подписи и конкурирующие полномочия дают канцелярии пространство для торга, но замедляют укрепление власти."
 OGO_atamanov_regency_spirit:0 "Управление Атаманова"
 OGO_atamanov_regency_spirit_desc:0 "Атаманов опирается на практических администраторов и офицеров, обещая порядок без попытки воскресить прежний совет."
 OGO_ilyich_conspiracy_spirit:0 "Заговор Гидры"
 OGO_ilyich_conspiracy_spirit_desc:0 "Неформальные обязательства связывают будущих участников переворота крепче, чем официальная присяга."
 OGO_purges_spirit:0 "Проверка лояльности"
 OGO_purges_spirit_desc:0 "Аппарат работает под угрозой следующего списка. Инициатива наказуема, послушание вознаграждается, опытные кадры исчезают."
 OGO_chaos_indivisible_spirit:0 "Хаос Неделимый"
 OGO_chaos_indivisible_spirit_desc:0 "Движение превращает борьбу со всякой устойчивой властью в источник мобилизации и постоянной внутренней неустойчивости."
 OGO_red_hammer_spirit:0 "Красный Молот"
 OGO_red_hammer_spirit_desc:0 "Централизованные распоряжения и революционная дисциплина объединяют производство и армию вокруг нового правительства."
 OGO_red_war_spirit:0 "Революционный поход"
 OGO_red_war_spirit_desc:0 "Война с Вихрем стала главным критерием лояльности и основным направлением работы военного аппарата."
 OGO_after_departure_spirit:0 "После отъезда"
 OGO_after_departure_spirit_desc:0 "Уход вождей оставил после себя спорные полномочия, пустые кабинеты и множество чиновников, утверждающих, что они всё предвидели."
 OGO_dark_watch_spirit:0 "Тёмный Дозор"
 OGO_dark_watch_spirit_desc:0 "Постоянное наблюдение стало основой обороны и управления. Спокойствие обеспечивается тем, что никто не знает состава дозорных списков."
 OGO_arena_spirit:0 "Порядок Арены"
 OGO_arena_spirit_desc:0 "Ильич и Перчик превращают соперничество групп в метод управления: побеждает тот, кто демонстрирует силу и не нарушает правил арбитража."
 OGO_dolgan_league_spirit:0 "Долганская лига"
 OGO_dolgan_league_spirit_desc:0 "Атаманов и Перчик распределяют власть через договоры и местные обязательства, предпочитая медленный торг новой мобилизации."
 VOR_spartak:0 "Спартак"
 VOR_spartak_desc:0 "Основатель Вихря, превращающий личные связи и армейскую дисциплину в устойчивый механизм власти."
 VOR_shlang:0 "Шланг"
 VOR_shlang_desc:0 "Полевой командир Амбрельного села, чья власть начинается с местной войны и зависит от доверия жителей."
 OGO_pidofil:0 "Пидофил"
 OGO_pidofil_desc:0 "Бывший глава Огорода и неутомимый составитель списков обид, убеждённый, что изгнание лишь отложило его правление."
 OGO_atamanov:0 "Атаманов"
 OGO_atamanov_desc:0 "Администратор переходных эпох, принимающий власть через процедуру и предпочитающий контролируемый компромисс открытому риску."
 OGO_ilyich:0 "Ильич"
 OGO_ilyich_desc:0 "Организатор Гидры и постоянный участник временных правительств, переживающий чужие эпохи с неизменным служебным спокойствием."
 OGO_dimbaz:0 "Димбаз"
 OGO_dimbaz_desc:0 "Коммунистический вождь Красного Молота, соединяющий революционную риторику с жёсткой централизацией командования."
 OGO_bair:0 "Баир"
 OGO_bair_desc:0 "Военный идеолог и практик Красного Молота, переводящий политические лозунги в точные армейские директивы."
 OGO_perchik:0 "Перчик"
 OGO_perchik_desc:0 "Хранитель процедур поздних режимов, чьё влияние основано на знании того, кто, когда и под какой формулировкой подписал решение."
