l_english:
 FIRST_SCHISM.1.b:0 "Preserve compromise at any cost."

 VOR_first_schism:0 "The Paper Peace of Vortex"
 VOR_first_schism_desc:0 "Old regulations still bear the signatures of people who no longer trust one another. Spartak keeps the formal order intact while preparing for its inevitable end."
 VOR_vortex_group:0 "The Vortex Group"
 VOR_vortex_group_desc:0 "From reports, passes, and personal debts, Spartak builds a new centre of power. The group promises neither justice nor mercy, only the execution of orders."
 VOR_military_reform:0 "A Headquarters Without Illusions"
 VOR_military_reform_desc:0 "Commanders will be judged by casualty reports and the speed with which they carry out instructions. Vortex's army must become an instrument that does not question its purpose."
 VOR_shadow_office:0 "The Office Without a Sign"
 VOR_shadow_office_desc:0 "A small department gains the right to seize correspondence, appoint observers, and settle problems without a record. Its authority is unwritten by design."
 VOR_disposable_detachments:0 "Disposable Detachments"
 VOR_disposable_detachments_desc:0 "The roster reserves a place for people whose names will not be needed after an operation. Command calls this flexibility; those in the field use another word."
 VOR_war_revival:0 "WAR Returns"
 VOR_war_revival_desc:0 "Spartak believes the time for cautious abbreviations has passed. WAR returns to the paperwork and banners as a reminder of what Vortex has always been."
 VOR_total_mobilization:0 "The Final Mobilization"
 VOR_total_mobilization_desc:0 "The rear, reserves, and civil administration now follow a single military schedule. The standing orders contain no procedure for ending mobilization."
 VOR_old_account:0 "An Old Score"
 VOR_old_account_desc:0 "Ogorod is named as the cause of every setback and the recipient of every future reparations list. The only remaining step is to give the war a legal form."
 VOR_war_collapse:0 "The Collapse of WAR"
 VOR_war_collapse_desc:0 "Plans demand people who no longer exist, and orders demand faith that has long since vanished. WAR must fall before someone can make use of its ruins."
 VOR_shadow_vortex_rebirth:0 "Vortex from the Underground"
 VOR_shadow_vortex_rebirth_desc:0 "Spartak survives in backroom negotiations and old contact lists. The new Vortex will not become a state; it will become the habit of a state asking permission."
 VOR_ambrelnoe_selo:0 "Ambrelnoe Village"
 VOR_ambrelnoe_selo_desc:0 "Shlang proposes starting with a village where power can still be measured in sacks of grain and the number of armed neighbours. Ambrelnoe will be his first headquarters."
 VOR_local_war:0 "A Small War"
 VOR_local_war_desc:0 "There are no fronts here, only roads, wells, and homes that cannot be left to the enemy. Victory belongs to whoever remains in the village after dark."
 VOR_guerrilla_warfare:0 "The Road Out"
 VOR_guerrilla_warfare_desc:0 "Shlang's units do not hold positions. They disappear before the pursuers and return before the supply wagons, making the terrain an extension of their headquarters."
 VOR_popular_support:0 "Bread Instead of Orders"
 VOR_popular_support_desc:0 "Requisition ledgers are replaced with lists of those in need, and patrols are told to protect distribution. Public trust becomes a resource as scarce as ammunition."
 VOR_exiles_dossier:0 "The Exile's File"
 VOR_exiles_dossier_desc:0 "After Atamanov's succession, Pidofil's name vanished from Ogorod's official papers. In Vortex's archive it reappeared on a separate, unmarked folder."
 VOR_revanchist_network:0 "A Network of Revenge"
 VOR_revanchist_network_desc:0 "Former clerks, resentful officers, and merchants of secrets receive one address for contact. Pidofil calls it justice and begins compiling a list of the guilty."
 VOR_betrayal_at_council:0 "Betrayal at the Council"
 VOR_betrayal_at_council_desc:0 "The necessary vote will be bought, the necessary witness silenced, and the minutes signed before the meeting begins. The return starts with an admission that the old rules were only tools."
 VOR_new_ogorod:0 "A New Ogorod"
 VOR_new_ogorod_desc:0 "Pidofil is ready to cross the threshold he once left without guards or farewells. The question is whether he returns as a ruler or as an invisible co-owner of the new order."

 OGO_first_schism:0 "The Schism Protocol"
 OGO_first_schism_desc:0 "The council still meets, but its decisions already travel through two competing offices. The next protocol will determine who has the right to speak for Ogorod."
 OGO_emergency_council:0 "Emergency Council"
 OGO_emergency_council_desc:0 "Compromise is declared a form of sabotage. The standing council is replaced by an emergency body, meetings are shortened, and its decisions are no longer open to appeal."
 OGO_general_mobilization:0 "General Mobilization"
 OGO_general_mobilization_desc:0 "Workshops, stores, and local patrols are brought under a single timetable. The Garden must prove it can defend the districts it claims to represent."
 OGO_iron_hand:0 "The Iron Hand"
 OGO_iron_hand_desc:0 "A single chain of responsibility and strict inspections discipline the administration while leaving little room for dissent."
 OGO_defeat_vortex:0 "Defeat Vortex"
 OGO_defeat_vortex_desc:0 "Every office is ordered to work toward a final settlement with Vortex. The plan is clear; whether Ogorod has the strength to carry it out remains uncertain."
 OGO_negotiations:0 "Negotiations"
 OGO_negotiations_desc:0 "The council decides to buy time through compromise. Every signature may postpone a confrontation, but every concession can become a precedent."
 OGO_division_of_power:0 "The Division of Power"
 OGO_division_of_power_desc:0 "Dual signatures and overlapping jurisdictions give the bureaucracy room to bargain, while slowing the consolidation of authority."
 OGO_atamanov_transfer:0 "Atamanov Takes the Reins"
 OGO_atamanov_transfer_desc:0 "The old council gives way to an administrator who promises order without attempting to restore the community that existed before the schism."
 OGO_ilyich_conspiracy:0 "Ilyich's Conspiracy"
 OGO_ilyich_conspiracy_desc:0 "Informal obligations bind the future plotters more tightly than any official oath. Ilyich builds a network behind the council's routine."
 OGO_ilyich_coup:0 "The Ilyich Coup"
 OGO_ilyich_coup_desc:0 "The offices change hands in a single night. By morning, those who held power yesterday are asked to explain why they were allowed to keep it."
 OGO_party_purges:0 "Lists of Loyalty"
 OGO_party_purges_desc:0 "The audit begins with Atamanov's former supporters, then reaches the officials conducting the audit. Each justification becomes material for the next case."
 OGO_chaos_indivisible:0 "Chaos Indivisible"
 OGO_chaos_indivisible_desc:0 "The movement turns resistance to every stable authority into a source of mobilisation, at the cost of perpetual internal instability."
 OGO_dimbaz_coup:0 "Dimbaz Takes Power"
 OGO_dimbaz_coup_desc:0 "A new leadership takes control with a language of collective discipline and a command structure modelled on the old Soviet ideal."
 OGO_red_hammer:0 "The Red Hammer"
 OGO_red_hammer_desc:0 "Centralized orders and revolutionary discipline unite production and the armed groups around the new leadership."
 OGO_bair_memoranda:0 "Bair's Memoranda"
 OGO_bair_memoranda_desc:0 "Bair translates political promises into precise operational rules. Standard training and supply procedures are meant to prevent the next split."
 OGO_war_with_vortex:0 "War Beneath the Red Banner"
 OGO_war_with_vortex_desc:0 "The military council receives an order to destroy Vortex. The language of liberation has become a general staff directive."
 OGO_departure:0 "The Eastbound Train"
 OGO_departure_desc:0 "Dimbaz and Bair depart without a ceremonial farewell. Loyal officials and part of the military archive leave with them, while Ilyich returns to the centre of power."
 OGO_late_era:0 "Two Inheritances"
 OGO_late_era_desc:0 "Ilyich and Atamanov offer different futures: Arena, where strength is tested in public, or the Dolgan League, where power is divided by contracts and carefully limited obligations."

 first_schism.2.t:0 "A Change of Guard"
 first_schism.2.desc:0 "Atamanov takes over after the old leadership fractures. The organisation keeps its people and bases, but its public identity changes to Wagner. The transfer is presented as a necessary correction rather than a victory by one faction."
 first_schism.2.a:0 "The new name will settle the argument."
 first_schism.3.t:0 "The Hydra Takes Shape"
 first_schism.3.desc:0 "Ilyich moves through the internal revolt with the patience of someone who has been waiting for it. Wagner becomes Hydra, and the organisation's decisions are increasingly shaped by private loyalty and political theatre."
 first_schism.3.a:0 "Let the old order be swallowed."
 first_schism.4.t:0 "The Red Hammer"
 first_schism.4.desc:0 "Dimbaz and Bair rebuild the group around a centralized command and Soviet-inspired discipline. The red banners are not the foundation of a state; they are the language of a new organisational model."
 first_schism.4.a:0 "A hammer will end the old order."
 first_schism.5.t:0 "The Eastbound Train"
 first_schism.5.desc:0 "Dimbaz and Bair leave without a public ceremony. Loyal commissioners and part of the military archive vanish with them. Ilyich returns to the centre of power and insists that he was never responsible for the failures of the previous leadership."
 first_schism.5.a:0 "Declare another transfer temporary."
 first_schism.6.t:0 "Two Inheritances"
 first_schism.6.desc:0 "Perchik keeps both options open. Ilyich proposes Arena, a system of public contests of strength; Atamanov proposes the Dolgan League, a network of contracts, compromise, and carefully delimited jurisdictions."
 first_schism.6.a:0 "Arena: Ilyich and Perchik."
 first_schism.6.b:0 "The Dolgan League: Atamanov and Perchik."
 first_schism.7.t:0 "Lists of Loyalty"
 first_schism.7.desc:0 "The audit begins with Atamanov's former associates, then reaches those conducting the audit. Departments compete to produce more accusations, and every defence becomes material for another case."
 first_schism.7.a:0 "Continue until everything is clear."
 first_schism.8.t:0 "War Beneath the Red Banner"
 first_schism.8.desc:0 "The military council receives a directive to destroy Vortex. Dimbaz calls the advance liberation, Bair specifies supply requirements, and nobody records when revolutionary language becomes a general staff order."
 first_schism.8.a:0 "Begin the final revolutionary campaign."
 first_schism.10.t:0 "WAR Returns"
 first_schism.10.desc:0 "Spartak signs the order restoring WAR without a ceremony or public address. The old name is expected to speak for itself. Within hours, messages about a new military order arrive in Ogorod."
 first_schism.10.a:0 "Let the name stop deceiving anyone."
 first_schism.11.t:0 "Dark Watch"
 first_schism.11.desc:0 "WAR's return prompts Ilyich to offer an answer. Dark Watch becomes an administration of permanent surveillance, where every resident is both a guardian of order and a possible violator."
 first_schism.11.a:0 "Begin the watch."
 first_schism.11.b:0 "Do not remake the organisation at someone else's command."
 first_schism.12.t:0 "The Collapse of WAR"
 first_schism.12.desc:0 "Mobilisation plans demand people who no longer exist, and orders demand faith that has vanished. Units abandon their posts and services stop reporting. WAR collapses with the precision of its own paperwork."
 first_schism.12.a:0 "Gather whatever still obeys."
 first_schism.13.t:0 "Vortex Without a Flag"
 first_schism.13.desc:0 "Out of basement meetings and saved contact lists, a new Vortex emerges. Spartak abandons WAR's grand title. Power must now be quiet, and therefore harder to reach."
 first_schism.13.a:0 "Work from the shadows."
 first_schism.14.t:0 "The Man Who Returned"
 first_schism.14.desc:0 "Pidofil arrives without an entourage, carrying only a folder of old debts. He has not forgiven Ogorod, forgotten Vortex, or learned to distinguish an organisation from his own biography."
 first_schism.14.a:0 "Proclaim Pidofil's New Ogorod."
 first_schism.14.b:0 "Keep him outside the public throne."

 VOR_vortex_group_spirit:0 "The Vortex Group"
 VOR_vortex_group_spirit_desc:0 "Spartak's personal chain of command reduces the distance between order and execution, while turning objections into disciplinary offences."
 VOR_reformed_command_spirit:0 "Reformed Headquarters"
 VOR_reformed_command_spirit_desc:0 "Commanders are trained to follow common procedures, and reserves receive accelerated preparation under staff supervision."
 VOR_shadow_office_spirit:0 "The Shadow Office"
 VOR_shadow_office_spirit_desc:0 "An unlisted department controls correspondence and communications. Its staff rarely appear in records, but their approvals appear everywhere."
 VOR_disposable_detachments_spirit:0 "Disposable Detachments"
 VOR_disposable_detachments_spirit_desc:0 "Command accepts casualties in exchange for operational tempo. Morale rises while public trust falls."
 VOR_war_spirit:0 "The WAR Machine"
 VOR_war_spirit_desc:0 "The old name removes the final constraints on military command and makes war a routine form of administration."
 VOR_total_mobilization_spirit:0 "Total Mobilization"
 VOR_total_mobilization_spirit_desc:0 "Reserves, transport, and administration work to a military schedule. There is no standing procedure for demobilisation."
 VOR_war_collapse_spirit:0 "WAR in Ruins"
 VOR_war_collapse_spirit_desc:0 "The link between headquarters and the field has failed. Every order must be reconfirmed, and every report checked for invented units."
 VOR_shadow_vortex_spirit:0 "Shadow Vortex"
 VOR_shadow_vortex_spirit_desc:0 "Spartak's revived network influences decisions through archives, intermediaries, and obligations rather than public commands."
 VOR_ambrelnoe_spirit:0 "The Ambrelnoe Order"
 VOR_ambrelnoe_spirit_desc:0 "Local administration rests on understandable distribution rules and personal accountability."
 VOR_guerrilla_spirit:0 "Guerrilla Geography"
 VOR_guerrilla_spirit_desc:0 "Tracks, shelters, and local observers form a second map that regular forces cannot easily read."
 VOR_popular_support_spirit:0 "Popular Support"
 VOR_popular_support_spirit_desc:0 "Protecting distribution and restricting requisitions builds trust that command must not waste."
 VOR_exile_network_spirit:0 "The Exile Network"
 VOR_exile_network_spirit_desc:0 "Pidofil's supporters keep in touch through former officials and commercial intermediaries."
 VOR_revanchism_spirit:0 "The Revanchist Office"
 VOR_revanchism_spirit_desc:0 "Accounts against the old Ogorod become a political programme. Every new ally is promised compensation."
 VOR_new_ogorod_spirit:0 "New Ogorod"
 VOR_new_ogorod_spirit_desc:0 "Pidofil merges his restored position with Vortex's apparatus and calls it corrected succession rather than occupation."
 VOR_compact_spirit:0 "The Closed-Door Compact"
 VOR_compact_spirit_desc:0 "Pidofil gains access to decisions but not the public throne. The ruling group uses his connections while fearing the price of the next favour."
 OGO_emergency_rule_spirit:0 "Emergency Rule"
 OGO_emergency_rule_spirit_desc:0 "Military deadlines replace ordinary procedure. The council meets briefly, and its decisions cannot be appealed."
 OGO_iron_hand_spirit:0 "The Iron Hand"
 OGO_iron_hand_spirit_desc:0 "A single chain of responsibility and strict inspections discipline the administration."
 OGO_ogorod_victory_spirit:0 "The Defeat of Vortex"
 OGO_ogorod_victory_spirit_desc:0 "The army and administration focus on settling the question of Vortex once and for all."
 OGO_divided_council_spirit:0 "The Divided Council"
 OGO_divided_council_spirit_desc:0 "Competing signatures leave room for bargaining but slow down the consolidation of authority."
 OGO_atamanov_regency_spirit:0 "Atamanov's Regency"
 OGO_atamanov_regency_spirit_desc:0 "Atamanov relies on practical administrators and officers, promising order without restoring the old council."
 OGO_ilyich_conspiracy_spirit:0 "The Hydra Conspiracy"
 OGO_ilyich_conspiracy_spirit_desc:0 "Informal obligations bind the future plotters more tightly than any official oath."
 OGO_purges_spirit:0 "Loyalty Reviews"
 OGO_purges_spirit_desc:0 "The apparatus works under threat of the next list. Initiative is punished, obedience rewarded, and experienced cadres disappear."
 OGO_chaos_indivisible_spirit:0 "Chaos Indivisible"
 OGO_chaos_indivisible_spirit_desc:0 "Resistance to stable authority becomes a source of mobilisation and perpetual instability."
 OGO_red_hammer_spirit:0 "The Red Hammer"
 OGO_red_hammer_spirit_desc:0 "Centralised orders and revolutionary discipline unite production and the armed groups."
 OGO_red_war_spirit:0 "The Revolutionary Campaign"
 OGO_red_war_spirit_desc:0 "War against Vortex becomes the main test of loyalty and the central task of the military apparatus."
 OGO_after_departure_spirit:0 "After the Departure"
 OGO_after_departure_spirit_desc:0 "The leaders' departure leaves disputed powers, empty offices, and officials claiming they foresaw everything."
 OGO_dark_watch_spirit:0 "Dark Watch"
 OGO_dark_watch_spirit_desc:0 "Permanent surveillance becomes the foundation of defence and administration."
 OGO_arena_spirit:0 "The Arena Order"
 OGO_arena_spirit_desc:0 "Ilyich and Perchik turn contests between groups into a method of government: strength wins, but the rules of arbitration remain."
 OGO_dolgan_league_spirit:0 "The Dolgan League"
 OGO_dolgan_league_spirit_desc:0 "Atamanov and Perchik divide power through contracts and local obligations, preferring slow bargaining to another mobilisation."

 VOR_spartak:0 "Spartak"
 VOR_spartak_desc:0 "Founder of Vortex, turning personal ties and military discipline into a durable mechanism of authority."
 VOR_shlang:0 "Shlang"
 VOR_shlang_desc:0 "A field commander from Ambrelnoe whose authority begins with local defence and depends on residents' trust."
 OGO_pidofil:0 "Pidofil"
 OGO_pidofil_desc:0 "Former head of Ogorod and tireless keeper of old grievances, convinced that exile merely postponed his rule."
 OGO_atamanov:0 "Atamanov"
 OGO_atamanov_desc:0 "An administrator of transitional eras who prefers controlled compromise to open risk."
 OGO_ilyich:0 "Ilyich"
 OGO_ilyich_desc:0 "An organiser of Hydra and permanent participant in temporary governments, surviving each era with the same bureaucratic calm."
 OGO_dimbaz:0 "Dimbaz"
 OGO_dimbaz_desc:0 "Communist leader of the Red Hammer, combining revolutionary rhetoric with centralized command."
 OGO_bair:0 "Bair"
 OGO_bair_desc:0 "A military organiser who translates political slogans into precise directives."
 OGO_perchik:0 "Perchik"
 OGO_perchik_desc:0 "A keeper of procedures whose influence rests on knowing who signed what, when, and under which wording."

