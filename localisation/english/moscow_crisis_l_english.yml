l_english:
 MOS:0 "Moscow Administration"
 MOS_DEF:0 "the Moscow Administration"
 MOS_ADJ:0 "Moscow"
 DWA:0 "Dark Watch"
 DWA_DEF:0 "the Dark Watch"
 DWA_ADJ:0 "Dark Watch"
 moscow_crisis.1.t:0 "The District Security Order"
 moscow_crisis.1.desc:0 "Moscow's municipal administration has assigned outer districts to rival organizations. Vortex is pressing Ogorod to accept a new security arrangement. Ogorod can risk open war or buy time through municipal procedure."
 moscow_crisis.1.a:0 "Mobilize and declare war on Vortex."
 moscow_crisis.1.b:0 "Accept the first municipal review."
 moscow_crisis.2.t:0 "The Levoberezhny Checkpoint"
 moscow_crisis.2.desc:0 "Vortex demands the transfer of Levoberezhny. Ogorod's council knows the first concession will set a precedent."
 moscow_crisis.2.a:0 "Enough. Declare war on Vortex."
 moscow_crisis.2.b:0 "Transfer Levoberezhny."
 moscow_crisis.2.c:0 "Ask the city administration for a delay."
 moscow_crisis.3.t:0 "The Khovrino Memorandum"
 moscow_crisis.3.desc:0 "Khovrino is next. Local commanders ask whether the council intends to defend any district at all."
 moscow_crisis.3.a:0 "End the process. Declare war."
 moscow_crisis.3.b:0 "Sign away Khovrino."
 moscow_crisis.3.c:0 "Use the municipal mediation window."
 moscow_crisis.4.t:0 "The Western Degunino Ultimatum"
 moscow_crisis.4.desc:0 "Vortex has reached the edge of Ogorod's northern belt. A third transfer will leave the council visibly weakened."
 moscow_crisis.4.a:0 "The next step will be war."
 moscow_crisis.4.b:0 "Give up Western Degunino."
 moscow_crisis.4.c:0 "Call the city council once more."
 moscow_crisis.5.t:0 "The Dark Watch Coup"
 moscow_crisis.5.desc:0 "After three concessions, Ogorod loses authority over its commanders. Ilyich's followers seize Otradnoye, Vostochnoye Degunino and Golovinsky. The Dark Watch offers no coherent doctrine beyond secrecy, intimidation and a cult of force."
 moscow_crisis.5.a:0 "The old council no longer commands the streets."
 MOS_first_mandate:0 "The Municipal Mandate"
 MOS_first_mandate_desc:0 "Moscow's administration must keep the centre functioning while rival organizations turn the outskirts into bargaining chips."
 MOS_admin_records:0 "Restore the District Registers"
 MOS_admin_records_desc:0 "Ownership lists, transport permits and patrol schedules must be collected before the city loses the ability to distinguish official checkpoints from private ones."
 MOS_public_works:0 "Keep the City Moving"
 MOS_public_works_desc:0 "Road maintenance, depots and transit links prove that the administration still exists."
 MOS_municipal_guard:0 "Organize the Municipal Guard"
 MOS_municipal_guard_desc:0 "A limited, accountable guard protects administrative buildings and public infrastructure."
 MOS_investigate_private_contracts:0 "Audit the Security Contracts"
 MOS_investigate_private_contracts_desc:0 "The administration audits procurement and private security contracts. Vortex loses room to manoeuvre while Ogorod may stabilize."
 MOS_mediation_committee:0 "Convene a Mediation Committee"
 MOS_mediation_committee_desc:0 "The city will not choose a clan, but can force rivals to explain themselves and grant Ogorod one delay."
 MOS_emergency_mandate:0 "Emergency Municipal Mandate"
 MOS_emergency_mandate_desc:0 "The council gains temporary powers to coordinate security, transport and emergency services."
 MOS_defend_city_charter:0 "Defend the City Charter"
 MOS_defend_city_charter_desc:0 "Neutrality is not passivity. The administration must preserve its authority through institutions and logistics."
 VOR_contract_pressure:0 "Pressure Through Contracts"
 VOR_contract_pressure_desc:0 "Spartak makes each transfer appear orderly, contractual and inevitable."
 VOR_claim_registry:0 "Register the New Perimeter"
 VOR_claim_registry_desc:0 "Each accepted handover becomes a line in the registry."
 DWA_first_coup:0 "Consolidate the Coup"
 DWA_first_coup_desc:0 "Ilyich's followers inherit a small territory and a network of personal debts."
 DWA_watch_discipline:0 "A Watch Without Sleep"
 DWA_watch_discipline_desc:0 "The organization learns to maintain pressure with small, loyal units."
 DWA_personal_loyalty:0 "The Inner Circle"
 DWA_personal_loyalty_desc:0 "Ilyich's authority grows from private obligations and mutual exposure."
 DWA_reach_into_ogorod:0 "Reach Into the Garden"
 DWA_reach_into_ogorod_desc:0 "The remaining Ogorod districts are unfinished business."
 DWA_open_conflict:0 "Make the Conflict Public"
 DWA_open_conflict_desc:0 "The Dark Watch abandons the fiction that it is only a security service and prepares for open conflict."
 DWA_spectacle:0 "Fear as a Spectacle"
 DWA_spectacle_desc:0 "Provocative symbols are tools of intimidation, not a coherent political doctrine."
 DWA_unseen_administration:0 "Administration in the Shadows"
 DWA_unseen_administration_desc:0 "Orders travel through intermediaries and vanish from official registers."
 DWA_shadow_rule:0 "The City Beneath the City"
 DWA_shadow_rule_desc:0 "The Dark Watch offers permanent suspicion held together by secrecy and personal force."
 MOS_municipal_authority_spirit:0 "Municipal Authority"
 MOS_municipal_authority_spirit_desc:0 "The administration retains a fragile monopoly over services, records and central districts."
 MOS_civic_guard_spirit:0 "Municipal Guard"
 MOS_civic_guard_spirit_desc:0 "The guard is accountable and designed to protect infrastructure rather than conquer."
 MOS_transport_spirit:0 "Working Transport Network"
 MOS_transport_spirit_desc:0 "A functioning transit network makes the movement of units and supplies more reliable."
 MOS_emergency_mandate_spirit:0 "Emergency Municipal Mandate"
 MOS_emergency_mandate_spirit_desc:0 "Temporary powers coordinate security and transport at the cost of a more militarized civic life."
 VOR_absorption_program_spirit:0 "Administrative Absorption Plan"
 VOR_absorption_program_spirit_desc:0 "Vortex turns each concession into a precedent and each precedent into a territorial claim."
 DWA_dark_watch_spirit:0 "Dark Watch"
 DWA_dark_watch_spirit_desc:0 "Secrecy and intimidation provide an advantage while undermining stability."
 DWA_shadow_network_spirit:0 "The Shadow Network"
 DWA_shadow_network_spirit_desc:0 "The Watch relies on private channels, informants and reciprocal debts."
 DWA_spectacle_spirit:0 "Radical Spectacle"
 DWA_spectacle_spirit_desc:0 "Provocative aesthetics mobilize supporters but deepen instability."
 MOS_council_desc:0 "A civil administrator trying to preserve city services and public authority while rival organizations compete for control."
